<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner West Watch — What's happening near you</title>
<meta name="description" content="Plain-language summaries of Inner West Council decisions — road works, parking, parks, planning, floods, budgets — and what they mean for your street.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f0f0f0;
    --card:      #ffffff;
    --ink:       #111111;
    --ink2:      #444444;
    --ink3:      #888888;
    --border:    #e4e4e4;
    --accent:    #1a56db;
    --accent-bg: #eff4ff;
    --warn:      #c2410c;
    --warn-bg:   #fff7ed;
    --red:       #dc2626;
    --red-bg:    #fef2f2;
    --grn:       #15803d;
    --grn-bg:    #f0fdf4;
    --ylw:       #92400e;
    --ylw-bg:    #fffbeb;
    --shadow:    0 1px 4px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.05);
    --radius:    14px;
    --radius-sm: 8px;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-eyebrow {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink3);
    margin-bottom: 3px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -.03em;
    line-height: 1.1;
  }
  .header-sub {
    font-size: 13px;
    color: var(--ink3);
    margin-top: 4px;
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink3);
    margin-right: 2px;
    white-space: nowrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--ink2);
    cursor: pointer;
    transition: background .1s, color .1s, border-color .1s;
    white-space: nowrap;
  }
  .chip:hover { background: var(--bg); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── PAGE BODY ── */
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  .section-heading {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink3);
    margin: 0 0 12px;
  }

  /* ── CARD GRID ── */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 600px) {
    .card-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 820px) {
    .card-grid { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* ── ITEM CARD ── */
  .item-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow .15s;
  }
  .item-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,.12), 0 0 1px rgba(0,0,0,.06);
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    white-space: nowrap;
  }
  /* Type tag colours — add new types here as the pipeline ingests them */
  .tag-crossing          { background: #dbeafe; color: #1e40af; }
  .tag-latm              { background: #ffedd5; color: #9a3412; }
  .tag-parking           { background: #ede9fe; color: #5b21b6; }
  .tag-speed             { background: #dcfce7; color: #166534; }
  .tag-event             { background: #fce7f3; color: #9d174d; }
  .tag-report            { background: #f1f5f9; color: #475569; }
  .tag-motion            { background: #fef9c3; color: #854d0e; }
  .tag-notice-of-motion  { background: #fef9c3; color: #854d0e; }
  .tag-infrastructure    { background: #d1fae5; color: #065f46; }
  .tag-suburb            { background: var(--bg); color: var(--ink3); font-weight: 600; }

  .card-headline {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    letter-spacing: -.01em;
  }

  /* The resident sentence — the honest plain-English read of the latest decision
     (ADR 0008). This, not the AI headline, is what explains the item on the card. */
  .card-sentence {
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink2);
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    gap: 8px;
  }
  .card-meeting {
    font-size: 11px;
    color: var(--ink3);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  /* Badge colours keyed to the topic's neutral `stage` (ADR 0004); the visible text is
     always the API's plain-English `label`, so colour is never the only signal. */
  .status-proposed     { background: var(--ylw-bg); color: var(--ylw); }     /* Coming up */
  .status-deferred     { background: #f1f5f9; color: #475569; }              /* Held over */
  .status-under-review { background: var(--accent-bg); color: var(--accent); } /* Being looked into */
  .status-decided      { background: var(--grn-bg); color: var(--grn); }     /* Decided */
  .status-in-progress  { background: var(--warn-bg); color: var(--warn); }   /* Underway */
  .status-completed    { background: var(--grn-bg); color: var(--grn); }     /* Finished */
  .status-other        { background: #f1f5f9; color: #475569; }              /* anything else */

  .card-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  .card-link:hover { text-decoration: underline; }

  /* ── EMPTY / ERROR STATES ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 0;
    color: var(--ink3);
    font-size: 14px;
  }
  .error-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 0;
    color: var(--warn);
    font-size: 14px;
  }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="header">
  <div class="header-eyebrow">Inner West Council</div>
  <h1>What's happening near you</h1>
  <p class="header-sub">Plain-language summaries of Inner West Council decisions — every committee, every kind of issue.</p>
</header>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Suburb</span>
  <button class="chip active" data-suburb="all" onclick="setFilter('all')">All</button>
</div>

<main class="page">
  <p class="section-heading" id="sectionHeading">Recent decisions</p>
  <div class="card-grid" id="cardGrid">
    <div class="empty-state">Loading…</div>
  </div>
</main>

<script>
  // Human-readable labels for decision types ingested by the pipeline.
  // Add new entries here when new types appear in D1.
  const TYPE_LABELS = {
    crossing:         'Crossing',
    latm:             'Traffic calming',
    parking:          'Parking',
    speed:            'Speed limit',
    event:            'Event closure',
    report:           'Report',
    motion:           'Motion',
    'notice-of-motion': 'Notice of motion',
    infrastructure:   'Infrastructure',
  };

  // The badge shows the API's plain-English `label` ("Decided", "Being looked into", …),
  // coloured by the topic's neutral `stage` (ADR 0004/0008). The old LTF-specific status
  // vocabulary (forum-yes, works-coming, …) was retired with the threaded model.
  const STAGE_CLASSES = ['proposed', 'deferred', 'under-review', 'decided', 'in-progress', 'completed'];
  function statusBadge(topic) {
    const cls = STAGE_CLASSES.includes(topic.stage) ? `status-${topic.stage}` : 'status-other';
    return { text: topic.label || topic.stage || 'Unknown', cls };
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
  }

  // Basic HTML-escape for API text interpolated into card markup.
  function esc(s) {
    return String(s ?? '').replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  }

  function renderCard(item) {
    const status     = statusBadge(item);
    const typeLabel  = TYPE_LABELS[item.type] || item.type;
    const typeClass  = 'tag-' + String(item.type || 'report').replace(/[^a-z0-9]/g, '-');

    const suburbTags = (item.suburbs || []).map(s =>
      `<span class="tag tag-suburb">${esc(s)}</span>`
    ).join('');

    // The card explains the topic's CURRENT state: the latest decision's resident
    // sentence (decisions[] arrives oldest-first from the API). The full trail belongs
    // on the future topic page, not the card (CONTEXT.md, "Where the sentence shows").
    const latest   = (item.decisions || [])[item.decisions.length - 1] || {};
    const sentence = latest.residentSentence || '';

    // Link to our own detail page when one exists, otherwise straight to the source
    // document on infocouncil — minutes if published, else the agenda. The site is a
    // digest, not a replacement: every card must reach the original document.
    const linkHref   = item.detailPage || latest.minutesUrl || latest.agendaUrl || '#';
    const linkTarget = item.detailPage ? '' : ' target="_blank" rel="noopener"';

    return `<a class="item-card" href="${esc(linkHref)}"${linkTarget} data-suburbs="${esc((item.suburbs || []).join(','))}">
  <div class="card-tags">
    <span class="tag ${typeClass}">${esc(typeLabel)}</span>
    ${suburbTags}
  </div>
  <div class="card-headline">${esc(item.subject)}</div>
  ${sentence ? `<div class="card-sentence">${esc(sentence)}</div>` : ''}
  <div class="card-footer">
    <span class="card-meeting">${fmtDate(item.lastSeen)}</span>
    <span class="status-badge ${status.cls}">${esc(status.text)}</span>
  </div>
</a>`;
  }

  let allItems     = [];
  let activeFilter = 'all';

  function setFilter(suburb) {
    activeFilter = suburb;
    document.querySelectorAll('#filterBar .chip').forEach(c => {
      c.classList.toggle('active', c.dataset.suburb === suburb);
    });
    renderGrid();
  }

  function renderGrid() {
    const grid    = document.getElementById('cardGrid');
    const visible = activeFilter === 'all'
      ? allItems
      : allItems.filter(item => (item.suburbs || []).includes(activeFilter));

    if (visible.length === 0) {
      grid.innerHTML = '<div class="empty-state">No items for this suburb yet.</div>';
    } else {
      grid.innerHTML = visible.map(renderCard).join('');
    }
  }

  function buildFilterChips(items) {
    // Remove any chips added by a previous fetch before rebuilding.
    document.querySelectorAll('#filterBar .chip:not([data-suburb="all"])').forEach(c => c.remove());
    const bar    = document.getElementById('filterBar');
    const suburbs = [...new Set(items.flatMap(i => i.suburbs || []))].sort();
    suburbs.forEach(s => {
      const btn = document.createElement('button');
      btn.className      = 'chip';
      btn.dataset.suburb = s;
      btn.textContent    = s;
      btn.onclick        = () => setFilter(s);
      bar.appendChild(btn);
    });
  }

  (async function init() {
    const grid = document.getElementById('cardGrid');
    try {
      const resp = await fetch('/api/items');
      if (!resp.ok) throw new Error(`API returned ${resp.status}`);

      const items = await resp.json();
      if (!Array.isArray(items) || items.length === 0) {
        grid.innerHTML = '<div class="empty-state">No decisions found.</div>';
        return;
      }

      allItems = items;
      buildFilterChips(allItems);
      renderGrid();
    } catch (err) {
      grid.innerHTML = `<div class="error-state">Could not load decisions — try refreshing.</div>`;
      console.error('Failed to fetch /api/items:', err);
    }
  })();
</script>
</body>
</html>
