# The weekly appender (ADR 0009, issue #83) — brings in new meetings AND newly published
# minutes for meetings we already hold, then writes the plain-English sentences and
# recomputes topic stages. Replaces the old "Ingest council meetings" workflow, whose
# scan skipped known meetings entirely and so never picked up minutes published after
# first ingest (the #83 failure: green runs, nothing imported).
#
# The appender exits non-zero if any meeting fails, so a broken week shows RED here.
name: Weekly append — new council decisions

on:
  schedule:
    # Every Monday at 9am AEST (11pm Sunday UTC).
    # LTF minutes are usually published within a week of the meeting,
    # so weekly is enough to catch new meetings and newly published minutes.
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      months:
        description: 'How many months back to scan (default: 6)'
        required: false
        default: '6'
      committee:
        description: 'Restrict to one committee slug (e.g. ltf, council) — leave blank for all'
        required: false
        default: ''
      dry_run:
        description: 'Set to "true" to report what would be done without writing'
        required: false
        default: ''

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the weekly appender
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          GITHUB_ACTIONS: 'true'
        run: |
          MONTHS="${{ github.event.inputs.months || '6' }}"
          COMMITTEE="${{ github.event.inputs.committee }}"
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS="--months $MONTHS"
          if [ -n "$COMMITTEE" ]; then
            ARGS="$ARGS --committee $COMMITTEE"
          fi
          if [ "$DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node db/append-weekly.js $ARGS
